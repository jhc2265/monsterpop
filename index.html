<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 확대를 막는다. 스와이프로 조작하는 게임이라 실수로 핀치가 들어가면
         확대된 화면이 좌우로 밀려 조작이 어긋난다.
         iOS 사파리는 user-scalable=no 를 무시하므로 main.jsx 에서 gesturestart 도 함께 막는다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0B2B" />
    <meta name="description" content="30초 동안 몬스터를 사냥하고 콤보를 쌓아 최고의 헌터에 도전하세요." />
    <title>MONSTERPOP | 30초 몬스터 헌팅</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
